name: incentive-platform
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?copy .env.example to .env}"
      MYSQL_USER: "${MYSQL_USER:-incentive}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?set MYSQL_PASSWORD}"
    ports: ["3307:3306"]
    volumes: ["mysql-data:/var/lib/mysql", "./deploy/mysql/init:/docker-entrypoint-initdb.d:ro"]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"], interval: 10s, timeout: 5s, retries: 10 }
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    ports: ["6379:6379"]
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-incentive}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}"
    ports: ["5672:5672", "15672:15672"]
  nacos:
    image: nacos/nacos-server:v2.5.1
    environment: { MODE: standalone, NACOS_AUTH_ENABLE: "false" }
    ports: ["8848:8848"]
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.4.2
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=${MYSQL_USER:-incentive}
        --spring.datasource.password=${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
        --xxl.job.accessToken=${XXL_JOB_ACCESS_TOKEN:?set XXL_JOB_ACCESS_TOKEN}
    ports: ["8088:8080"]
    depends_on: { mysql: { condition: service_healthy } }
  gateway:
    build: { context: ., args: { MODULE: gateway } }
    ports: ["8080:8080"]
    environment:
      NACOS_ADDR: nacos:8848
      USER_SERVICE_URL: http://user-service:8081
      POINTS_SERVICE_URL: http://points-service:8082
      INCENTIVE_SERVICE_URL: http://incentive-service:8085
      AWARD_SERVICE_URL: http://award-service:8084
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:?set REDIS_PASSWORD}"
    depends_on: { user-service: { condition: service_started }, points-service: { condition: service_started }, incentive-service: { condition: service_started }, award-service: { condition: service_started } }
  web:
    build: { context: ./web }
    ports: ["80:80"]
    depends_on: { gateway: { condition: service_started } }
  user-service:
    build: { context: ., args: { MODULE: user-service } }
    environment:
      NACOS_ADDR: nacos:8848
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-incentive}
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?set MYSQL_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET}"
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-P30D}
      REFRESH_TOKEN_COOKIE_SECURE: "${REFRESH_TOKEN_COOKIE_SECURE:-false}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:?set REDIS_PASSWORD}"
  points-service:
    build: { context: ., args: { MODULE: points-service } }
    environment:
      NACOS_ADDR: nacos:8848
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-incentive}
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?set MYSQL_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET}"
      INTERNAL_JWT_SECRET: "${INTERNAL_JWT_SECRET:?set INTERNAL_JWT_SECRET}"
      XXL_JOB_ENABLED: "true"
      XXL_JOB_ADMIN_ADDRESSES: http://xxl-job-admin:8080
      XXL_JOB_ACCESS_TOKEN: "${XXL_JOB_ACCESS_TOKEN:?set XXL_JOB_ACCESS_TOKEN}"
      XXL_JOB_EXECUTOR_APP_NAME: incentive-points-service
      XXL_JOB_EXECUTOR_PORT: 9999
      XXL_JOB_LOG_PATH: /var/log/xxl-job
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:?set REDIS_PASSWORD}"
    depends_on: { xxl-job-admin: { condition: service_started } }
  incentive-service:
    build: { context: ., args: { MODULE: incentive-service } }
    environment:
      NACOS_ADDR: nacos:8848
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-incentive}
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?set MYSQL_PASSWORD}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:?set REDIS_PASSWORD}"
      POINTS_SERVICE_URL: http://points-service:8082
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET}"
      INTERNAL_JWT_SECRET: "${INTERNAL_JWT_SECRET:?set INTERNAL_JWT_SECRET}"
      XXL_JOB_ENABLED: "true"
      XXL_JOB_ADMIN_ADDRESSES: http://xxl-job-admin:8080
      XXL_JOB_ACCESS_TOKEN: "${XXL_JOB_ACCESS_TOKEN:?set XXL_JOB_ACCESS_TOKEN}"
      XXL_JOB_EXECUTOR_APP_NAME: incentive-lottery-service
      XXL_JOB_EXECUTOR_PORT: 9998
      XXL_JOB_LOG_PATH: /var/log/xxl-job
    depends_on: { xxl-job-admin: { condition: service_started } }
  award-service:
    build: { context: ., args: { MODULE: award-service } }
    environment:
      NACOS_ADDR: nacos:8848
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-incentive}
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?set MYSQL_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:?set REDIS_PASSWORD}"
volumes: { mysql-data: {} }
