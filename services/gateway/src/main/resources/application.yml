spring:
  application: { name: gateway }
  cloud:
    nacos: { discovery: { server-addr: ${NACOS_ADDR:nacos:8848} } }
    gateway:
      routes:
        - { id: user, uri: http://user-service:8081, predicates: [ Path=/api/v1/auth/**,/api/v1/users/** ] }
        - { id: points, uri: http://points-service:8082, predicates: [ Path=/api/v1/points/** ] }
        - { id: incentive, uri: http://incentive-service:8083, predicates: [ Path=/api/v1/activities/**,/api/v1/exchanges/**,/api/v1/lotteries/** ] }
        - { id: award, uri: http://award-service:8084, predicates: [ Path=/api/v1/awards/** ] }
server: { port: 8080 }
management: { endpoints: { web: { exposure: { include: health,info,metrics } } } }
