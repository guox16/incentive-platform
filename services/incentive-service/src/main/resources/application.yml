spring:
  application: { name: incentive-service }
  cloud: { nacos: { discovery: { server-addr: "${NACOS_ADDR:localhost:8848}" } } }
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/incentive_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
  jpa:
    hibernate: { ddl-auto: update }
    open-in-view: false
clients:
  points:
    base-url: ${POINTS_SERVICE_URL:http://localhost:8082}
id-generator:
  worker-id: ${SNOWFLAKE_WORKER_ID:1}
server: { port: 8085 }
management: { endpoints: { web: { exposure: { include: health,info,metrics } } } }
xxl:
  job:
    admin:
      addresses: "${XXL_JOB_ADMIN_ADDRESSES:http://xxl-job-admin:8080}"
      timeout: ${XXL_JOB_ADMIN_TIMEOUT:3}
    executor:
      enabled: ${XXL_JOB_ENABLED:false}
      appname: "${XXL_JOB_EXECUTOR_APP_NAME:incentive-lottery-service}"
      access-token: "${XXL_JOB_ACCESS_TOKEN:}"
      ip: "${XXL_JOB_EXECUTOR_IP:}"
      address: "${XXL_JOB_EXECUTOR_ADDRESS:}"
      port: ${XXL_JOB_EXECUTOR_PORT:9998}
      log-path: "${XXL_JOB_LOG_PATH:./logs/xxl-job}"
      log-retention-days: ${XXL_JOB_LOG_RETENTION_DAYS:30}
lottery:
  retry:
    reconciliation-delay: ${LOTTERY_RECONCILIATION_DELAY:PT5S}
    stale-threshold: ${LOTTERY_RETRY_STALE_THRESHOLD:PT30S}
    batch-size: ${LOTTERY_RETRY_BATCH_SIZE:100}
    max-per-run: ${LOTTERY_RETRY_MAX_PER_RUN:1000}
security:
  jwt:
    secret: "${JWT_SECRET:development-only-change-this-jwt-secret-now}"
    issuer: "${JWT_ISSUER:https://incentive.local}"
    audience: "${JWT_AUDIENCE:incentive-api}"
  internal-jwt:
    secret: "${INTERNAL_JWT_SECRET:development-only-change-this-internal-secret}"
    issuer: "${INTERNAL_JWT_ISSUER:incentive-service}"
    audience: "${INTERNAL_JWT_AUDIENCE:points-service}"
    token-ttl: "${INTERNAL_JWT_TTL:PT1M}"
