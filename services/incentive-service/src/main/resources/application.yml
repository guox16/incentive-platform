spring:
  application: { name: incentive-service }
  cloud: { nacos: { discovery: { server-addr: "${NACOS_ADDR:localhost:8848}" } } }
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/incentive_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
  jpa:
    hibernate: { ddl-auto: update }
    open-in-view: false
clients:
  points:
    base-url: ${POINTS_SERVICE_URL:http://points-service:8082}
server: { port: 8083 }
management: { endpoints: { web: { exposure: { include: health,info,metrics } } } }
