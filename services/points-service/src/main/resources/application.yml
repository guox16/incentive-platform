spring:
  application:
    name: points-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
  cloud:
    nacos:
      discovery:
        server-addr: "${NACOS_ADDR:nacos:8848}"
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/points_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:incentive}
    password: ${MYSQL_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
server:
  port: 8082
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
security:
  jwt:
    secret: "${JWT_SECRET:development-only-change-this-jwt-secret-now}"
    issuer: "${JWT_ISSUER:https://incentive.local}"
    audience: "${JWT_AUDIENCE:incentive-api}"
  internal-jwt:
    secret: "${INTERNAL_JWT_SECRET:development-only-change-this-internal-secret}"
    issuer: "${INTERNAL_JWT_ISSUER:incentive-service}"
    audience: "${INTERNAL_JWT_AUDIENCE:points-service}"
    token-ttl: "${INTERNAL_JWT_TTL:PT1M}"
