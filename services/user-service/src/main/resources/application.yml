spring:
  application:
    name: user-service
  cloud:
    nacos:
      discovery:
        server-addr: "${NACOS_ADDR:localhost:8848}"
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/user_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
server: { port: 8081 }
management: { endpoints: { web: { exposure: { include: health,info,metrics } } } }
