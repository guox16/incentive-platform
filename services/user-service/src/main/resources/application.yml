spring:
  application:
    name: user-service
  cloud:
    nacos:
      discovery:
        server-addr: "${NACOS_ADDR:localhost:8848}"
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/user_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
server: { port: 8081 }
management: { endpoints: { web: { exposure: { include: health,info,metrics } } } }
security:
  jwt:
    secret: "${JWT_SECRET:development-only-change-this-jwt-secret-now}"
    issuer: "${JWT_ISSUER:https://incentive.local}"
    audience: "${JWT_AUDIENCE:incentive-api}"
    access-token-ttl: "${JWT_ACCESS_TOKEN_TTL:PT15M}"
